# Prometheus: postgres_exporter (БД) + node_exporter (хост: CPU, RAM, диск). Всё внутри Docker-сети.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: postgres
    static_configs:
      - targets: ["postgres_exporter:9187"]

  - job_name: node
    static_configs:
      - targets: ["node_exporter:9100"]
