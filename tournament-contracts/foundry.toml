[profile.default]
src = 'src'
out = 'out'
libs = ['lib']
script = 'script'
solc = "0.8.24"
via_ir = true
optimizer = true
optimizer_runs = 200
[rpc_endpoints]
abstract = "https://api.mainnet.abs.xyz"
avalanche = "https://api.avax.network/ext/bc/C/rpc"
[etherscan]
abstract = { key = "${ETHERSCAN_API_KEY}" }
avalanche = { key = "${SNOWTRACE_API_KEY}" }